<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>moneynomoney</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Plus+Jakarta+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* Reset and Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #08080c;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --accent-color: #a855f7; /* Purple */
            --accent-glow: rgba(168, 85, 247, 0.4);
            --secondary-color: #06b6d4; /* Cyan */
            --secondary-glow: rgba(6, 182, 212, 0.4);
            --telegram-color: #229ED9;
            --telegram-glow: rgba(34, 158, 217, 0.4);
            --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-title: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Background Glowing Orbs */
        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0.15;
            z-index: 1;
            pointer-events: none;
            transition: all 1s ease;
        }

        .bg-glow-1 {
            background: radial-gradient(circle, var(--accent-color) 0%, transparent 70%);
            top: -10%;
            left: -10%;
            animation: pulseGlow 10s infinite alternate;
        }

        .bg-glow-2 {
            background: radial-gradient(circle, var(--secondary-color) 0%, transparent 70%);
            bottom: -10%;
            right: -10%;
            animation: pulseGlow 8s infinite alternate-reverse;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.12; }
            100% { transform: scale(1.2) translate(50px, 50px); opacity: 0.22; }
        }

        /* Container */
        .container {
            width: 100%;
            max-width: 1200px;
            padding: 2rem;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            text-align: center;
            width: 100%;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .logo-text {
            font-family: var(--font-title);
            font-size: 5.5rem;
            font-weight: 800;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #ffffff 10%, #a855f7 50%, #06b6d4 90%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 6s linear infinite;
            text-shadow: 0 0 40px rgba(168, 85, 247, 0.2);
            margin-bottom: 0.5rem;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Action Buttons Wrapper */
        .actions-wrapper {
            display: flex;
            gap: 1.25rem;
            justify-content: center;
            align-items: center;
        }

        /* Buttons Styling */
        .btn {
            font-family: var(--font-main);
            font-weight: 600;
            font-size: 1.05rem;
            padding: 1rem 2.5rem;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-color) 0%, #8b5cf6 100%);
            color: white;
            box-shadow: 0 0 25px var(--accent-glow);
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.6);
        }

        /* Telegram Button */
        .btn-telegram {
            background: linear-gradient(135deg, #2aabee 0%, #229ED9 100%);
            color: white;
            box-shadow: 0 0 25px var(--telegram-glow);
        }

        .btn-telegram:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 35px rgba(34, 158, 217, 0.7);
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .logo-text {
                font-size: 3.5rem;
            }

            .actions-wrapper {
                flex-direction: column;
                width: 100%;
                max-width: 300px;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Radial Background Accents for Premium Look -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="container">
        <div class="hero-content">
            <h1 class="logo-text">moneynomoney</h1>
            
            <div class="actions-wrapper">
                <!-- Single Download Button -->
                <button id="download-btn" class="btn btn-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    <span>Download</span>
                </button>

                <!-- Telegram Button -->
                <a href="https://t.me/moneynomoney" target="_blank" class="btn btn-telegram">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    <span>Telegram</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const downloadBtn = document.getElementById('download-btn');
            downloadBtn.addEventListener('click', () => {
                alert('Downloading injector...');
                // Здесь вы можете прописать скачивание инжектора:
                // window.location.href = 'downloads/injector.exe';
            });
        });
    </script>
</body>
</html>
